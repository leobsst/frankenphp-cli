name: Release

# Releases are only published from the Actions UI (or `gh workflow run`), by a
# repository admin, in their own name: pushing a tag no longer releases.
#
# Setup: the RELEASE_TOKENS secret holds a JSON object mapping each admin's
# GitHub login to a personal access token of theirs (fine-grained, this
# repository only, "Contents: Read and write"), e.g.
#   {"alice": "github_pat_...", "bob": "github_pat_..."}
# The release (and its tag) is created with the token of whoever runs the
# workflow, so GitHub shows them as its author.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 or 1.2.0-rc.1 (a leading v is ignored)"
        required: true
        type: string
      # GitHub has no multiline/Markdown input type: for long notes, tick
      # "draft" and write them in the release editor before publishing it
      changelog:
        description: >-
          Optional short changelog (Markdown, \n for a line break). For long
          notes, tick "draft" below and edit the release on GitHub instead.
          Defaults to the version's section of CHANGELOG.md.
        required: false
        type: string
        default: ""
      draft:
        description: "Create a draft release, to write the notes in GitHub's Markdown editor before publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  authorize:
    name: Check release permission
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Require a repository admin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          PERMISSION=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission')
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::Only repository admins can publish a release: ${ACTOR} has '${PERMISSION}' permission."
            exit 1
          fi
          echo "${ACTOR} is a repository admin"

      - name: Require the admin's release token
        env:
          RELEASE_TOKENS: ${{ secrets.RELEASE_TOKENS }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          TOKEN=""
          if [ -n "$RELEASE_TOKENS" ]; then
            TOKEN=$(jq -r --arg actor "$ACTOR" '.[$actor] // empty' <<< "$RELEASE_TOKENS" 2>/dev/null || true)
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::No token for ${ACTOR} in the RELEASE_TOKENS secret: add {\"${ACTOR}\": \"<personal access token>\"} to it (see the top of release.yml)."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          LOGIN=$(GH_TOKEN="$TOKEN" gh api user --jq '.login')
          if [ "$LOGIN" != "$ACTOR" ]; then
            echo "::error::The RELEASE_TOKENS entry of ${ACTOR} belongs to '${LOGIN}'."
            exit 1
          fi

      - name: Validate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '${INPUT_VERSION}': expected X.Y.Z or X.Y.Z-suffix."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-binaries:
    name: Build ${{ matrix.os }} binary
    needs: authorize
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Pin the exact release version so a binary built ahead of its tag
      # (the tag is only created at the end, with the release) never embeds
      # a "guess-next-dev" version — only source/non-binary installs
      # should ever report a .dev version. hatch-vcs calls
      # setuptools_scm.get_version() without a dist_name, so only the
      # unscoped SETUPTOOLS_SCM_PRETEND_VERSION is actually read (the
      # dist-scoped _FOR_<NAME> variant is silently ignored).
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.authorize.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: frankenmanager-linux-x86_64
          - os: macos-latest
            artifact_name: frankenmanager-macos-arm64
          # - os: macos-15-large
          #   artifact_name: frankenmanager-macos-x86_64
          # - os: windows-latest
          #   artifact_name: frankenmanager-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history and tags for version detection

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch-vcs  # Required for version detection
          pip install -e .
          pip install pyinstaller

      - name: Warn about missing Apple signing secrets
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 == ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          echo "::warning::macOS binary will NOT be signed or notarized. Users will need to manually allow it in System Settings."
          echo ""
          echo "To enable code signing, add the following secrets in Settings > Secrets and variables > Actions:"
          echo ""
          echo "1. APPLE_CERTIFICATE_BASE64"
          echo "   - Open Keychain Access, export your 'Developer ID Application' certificate as .p12"
          echo "   - Encode it: base64 -i YourCertificate.p12 | pbcopy"
          echo "   - Paste the result as the secret value"
          echo ""
          echo "2. APPLE_CERTIFICATE_PASSWORD"
          echo "   - The password you chose when exporting the .p12 file"
          echo ""
          echo "3. APPLE_NOTARY_CREDENTIALS"
          echo '   - A JSON object: {"apple_id": "your@email.com", "team_id": "XXXXXXXXXX", "app_specific_password": "xxxx-xxxx-xxxx-xxxx"}'
          echo "   - Generate an app-specific password at https://appleid.apple.com/account/manage"
          echo "   - Find your Team ID at https://developer.apple.com/account#MembershipDetailsCard"

      - name: Setup macOS code signing keychain
        id: macos-keychain
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          # Find signing identity and export for next steps
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Signing with identity: $IDENTITY"
          echo "identity=$IDENTITY" >> $GITHUB_OUTPUT
          echo "keychain_path=$KEYCHAIN_PATH" >> $GITHUB_OUTPUT
          echo "keychain_password=$KEYCHAIN_PASSWORD" >> $GITHUB_OUTPUT

      - name: Build binary (macOS signed)
        if: runner.os == 'macOS' && steps.macos-keychain.outputs.identity != ''
        env:
          CODESIGN_IDENTITY: ${{ steps.macos-keychain.outputs.identity }}
          ENTITLEMENTS_FILE: entitlements.plist
        run: python scripts/build.py --clean --release

      - name: Build binary (unsigned)
        if: runner.os != 'macOS' || steps.macos-keychain.outputs.identity == ''
        run: python scripts/build.py --clean --release

      - name: Notarize macOS binary
        if: runner.os == 'macOS' && steps.macos-keychain.outputs.identity != ''
        env:
          APPLE_NOTARY_CREDENTIALS: ${{ secrets.APPLE_NOTARY_CREDENTIALS }}
        run: |
          # Legacy single-file binary (everything matching but the .tar.gz archive)
          LEGACY_PATH=$(ls dist/frankenmanager-* | grep -v '\.tar\.gz$')

          # Verify signatures
          codesign --verify --verbose dist/frankenmanager/frankenmanager
          codesign --verify --verbose "$LEGACY_PATH"
          codesign --verify --deep --strict --verbose dist/frankenmanager/FrankenManager.app
          echo "Binary signatures verified"

          # Parse notary credentials
          APPLE_ID=$(echo "$APPLE_NOTARY_CREDENTIALS" | python3 -c "import sys,json; print(json.load(sys.stdin)['apple_id'])")
          TEAM_ID=$(echo "$APPLE_NOTARY_CREDENTIALS" | python3 -c "import sys,json; print(json.load(sys.stdin)['team_id'])")
          APP_PASSWORD=$(echo "$APPLE_NOTARY_CREDENTIALS" | python3 -c "import sys,json; print(json.load(sys.stdin)['app_specific_password'])")

          # Create zip for notarization (onedir bundle + legacy binary)
          NOTARIZE_DIR=$RUNNER_TEMP/notarize
          mkdir -p "$NOTARIZE_DIR"
          cp -R dist/frankenmanager "$LEGACY_PATH" "$NOTARIZE_DIR/"
          ZIP_PATH=$RUNNER_TEMP/frankenmanager.zip
          ditto -c -k --keepParent "$NOTARIZE_DIR" "$ZIP_PATH"

          # Submit for notarization and wait
          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait --timeout 10m

          echo "macOS binaries signed and notarized successfully"

      - name: Cleanup macOS keychain
        if: always() && steps.macos-keychain.outputs.keychain_path != ''
        run: security delete-keychain "${{ steps.macos-keychain.outputs.keychain_path }}"

      - name: Test binary (Unix)
        if: runner.os != 'Windows'
        run: |
          # Run the bundle as installed: extracted from the release archive
          # and called through a symlink, like install.sh does
          TEST_DIR=$RUNNER_TEMP/bundle-test
          mkdir -p "$TEST_DIR/bin"
          tar -xzf dist/frankenmanager-*.tar.gz -C "$TEST_DIR"
          ln -s "$TEST_DIR/frankenmanager/frankenmanager" "$TEST_DIR/bin/frankenmanager"
          "$TEST_DIR/bin/frankenmanager" --version
          "$TEST_DIR/bin/frankenmanager" --help

          # macOS: the app launcher used by the LaunchAgent reaches the CLI
          if [ "$RUNNER_OS" = "macOS" ]; then
            "$TEST_DIR/frankenmanager/FrankenManager.app/Contents/MacOS/frankenmanager-agent" --version
          fi

          LEGACY_PATH=$(ls dist/frankenmanager-* | grep -v '\.tar\.gz$')
          chmod +x "$LEGACY_PATH"
          "$LEGACY_PATH" --version

      - name: Test binary (Windows)
        if: runner.os == 'Windows'
        run: |
          dist\frankenmanager-*.exe --version
          dist\frankenmanager-*.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/frankenmanager-*
          if-no-files-found: error

  build-python-package:
    name: Build Python package
    needs: authorize
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.authorize.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history and tags for version detection

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build hatch-vcs

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [authorize, build-binaries, build-python-package]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Copy binaries
          cp artifacts/frankenmanager-linux-x86_64/* release-assets/ || true
          cp artifacts/frankenmanager-macos-arm64/* release-assets/ || true
          cp artifacts/frankenmanager-macos-x86_64/* release-assets/ || true
          cp artifacts/frankenmanager-windows-x86_64.exe/* release-assets/ || true

          # Copy Python packages
          cp artifacts/python-package/* release-assets/ || true

          # Make Unix binaries executable
          chmod +x release-assets/frankenmanager-linux-* release-assets/frankenmanager-macos-* 2>/dev/null || true

          # List all assets
          echo "Release assets:"
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract CHANGELOG for version
        id: changelog
        run: |
          VERSION="${{ needs.authorize.outputs.version }}"

          # Extract the section for this version from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            echo "Extracting changelog for version $VERSION"

            # Use awk to extract content between version headers
            CHANGELOG_CONTENT=$(awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '$d' | tail -n +2)

            # Check if we extracted anything meaningful
            if [ -n "$CHANGELOG_CONTENT" ]; then
              # Save to file for use in release body
              echo "$CHANGELOG_CONTENT" > changelog_extract.md
              echo "has_content=true" >> $GITHUB_OUTPUT
            else
              echo "No content found for version $VERSION in CHANGELOG.md"
              echo "has_content=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "CHANGELOG.md not found"
            echo "has_content=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release body
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
        run: |
          cat > release_body.md << 'EOF'
          ## What's Changed

          EOF

          # Changelog given when running the workflow first (literal \n typed
          # in the UI field become line breaks), then CHANGELOG.md
          if [ -n "${CHANGELOG_INPUT//[[:space:]]/}" ]; then
            NL=$'\n'
            printf '%s\n\n' "${CHANGELOG_INPUT//\\n/$NL}" >> release_body.md
          elif [ -f changelog_extract.md ] && [ "${{ steps.changelog.outputs.has_content }}" == "true" ]; then
            cat changelog_extract.md >> release_body.md
            echo "" >> release_body.md
          else
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes." >> release_body.md
            echo "" >> release_body.md
          fi

          cat >> release_body.md << 'EOF'

          ## Installation

          ### Pre-built Binaries (Recommended)

          Download the appropriate archive for your platform:

          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | macOS | Apple Silicon | `frankenmanager-macos-arm64.tar.gz` |
          | macOS | Intel | `frankenmanager-macos-x86_64.tar.gz` |
          | Linux | x86_64 | `frankenmanager-linux-x86_64.tar.gz` |

          Each archive contains a `frankenmanager/` directory: keep it whole and
          put its `frankenmanager` executable on your PATH (e.g. with a symlink).
          The bare `frankenmanager-<platform>` binaries are slower-starting
          single-file builds, only kept so that older installs can self-update.

          #### Quick Install (macOS/Linux)

          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/install.sh | bash
          ```

          Or pin to this specific version:

          ```bash
          VERSION=${{ needs.authorize.outputs.version }} curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/install.sh | bash
          ```

          ### Python Package (pip)

          ```bash
          pip install frankenmanager
          # or
          pipx install frankenmanager
          ```

          ## First-time Setup

          After installation, run the setup command to configure passwordless privilege escalation and install dependencies:

          ```bash
          sudo frankenmanager setup --install-mkcert
          ```

          This will:
          - Configure passwordless `/etc/hosts` modifications
          - Install mkcert for SSL certificate generation

          ## Verify Installation

          ```bash
          frankenmanager --version
          frankenmanager setup --status
          ```
          EOF

      - name: Resolve the release token of the triggering admin
        id: token
        env:
          RELEASE_TOKENS: ${{ secrets.RELEASE_TOKENS }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          TOKEN=$(jq -er --arg actor "$ACTOR" '.[$actor]' <<< "$RELEASE_TOKENS")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Created with the admin's own token, so the release and its tag (made
      # on the built commit) are authored by them, not by github-actions
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.token.outputs.token }}
          tag_name: v${{ needs.authorize.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FrankenManager v${{ needs.authorize.outputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ needs.authorize.outputs.prerelease == 'true' }}
          generate_release_notes: false
          files: |
            release-assets/*
          body_path: release_body.md

