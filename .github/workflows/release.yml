name: Release

# Releases are only published from the Actions UI (or `gh workflow run`), by a
# repository admin, in their own name: pushing a tag no longer releases.
#
# Setup: the RELEASE_TOKENS secret holds a JSON object mapping each admin's
# GitHub login to a personal access token of theirs (fine-grained, this
# repository only, "Contents: Read and write"), e.g.
#   {"alice": "github_pat_...", "bob": "github_pat_..."}
# The release (and its tag) is created with the token of whoever runs the
# workflow, so GitHub shows them as its author.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 or 1.2.0-rc.1 (a leading v is ignored)"
        required: true
        type: string
      # GitHub has no multiline/Markdown input type: for long notes, tick
      # "draft" and write them in the release editor before publishing it
      changelog:
        description: >-
          Optional short changelog (Markdown, \n for a line break). For long
          notes, tick "draft" below and edit the release on GitHub instead.
          Defaults to the version's section of CHANGELOG.md.
        required: false
        type: string
        default: ""
      draft:
        description: "Create a draft release, to write the notes in GitHub's Markdown editor before publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  authorize:
    name: Check release permission
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Require a repository admin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          PERMISSION=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission')
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::Only repository admins can publish a release: ${ACTOR} has '${PERMISSION}' permission."
            exit 1
          fi
          echo "${ACTOR} is a repository admin"

      - name: Require the admin's release token
        env:
          RELEASE_TOKENS: ${{ secrets.RELEASE_TOKENS }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          TOKEN=""
          if [ -n "$RELEASE_TOKENS" ]; then
            TOKEN=$(jq -r --arg actor "$ACTOR" '.[$actor] // empty' <<< "$RELEASE_TOKENS" 2>/dev/null || true)
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::No token for ${ACTOR} in the RELEASE_TOKENS secret: add {\"${ACTOR}\": \"<personal access token>\"} to it (see the top of release.yml)."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          LOGIN=$(GH_TOKEN="$TOKEN" gh api user --jq '.login')
          if [ "$LOGIN" != "$ACTOR" ]; then
            echo "::error::The RELEASE_TOKENS entry of ${ACTOR} belongs to '${LOGIN}'."
            exit 1
          fi

      - name: Validate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '${INPUT_VERSION}': expected X.Y.Z or X.Y.Z-suffix."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the bundles (7 targets)
    needs: authorize
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERSION: ${{ needs.authorize.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Test
        run: go test ./...

      # Reproducible archives: every entry gets the commit time
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build every bundle
        run: go run ./cmd/release stage -version "$VERSION" -out dist

      - name: Package Linux and Windows
        run: >-
          go run ./cmd/release pack -out dist
          -targets linux/amd64,linux/arm64,linux/arm,windows/amd64,windows/arm64

      - name: Test the Linux bundle as installed
        run: |
          # Extracted from its archive and called through a symlink, like install.sh
          TEST_DIR=$RUNNER_TEMP/bundle-test
          mkdir -p "$TEST_DIR/bin"
          tar -xzf dist/assets/frankenmanager-linux-x86_64.tar.gz -C "$TEST_DIR"
          ln -s "$TEST_DIR/frankenmanager/frankenmanager" "$TEST_DIR/bin/frankenmanager"
          test "$("$TEST_DIR/bin/frankenmanager" --version)" = "FrankenManager version $VERSION"
          "$TEST_DIR/bin/frankenmanager" --help > /dev/null
          test "$(dist/assets/frankenmanager-linux-x86_64 --version)" = "FrankenManager version $VERSION"

      # Artifacts drop the execute bit: the macOS stage travels as a tarball
      - name: Bundle the macOS stage
        run: tar -czf stage-macos.tar.gz -C dist stage/darwin-amd64 stage/darwin-arm64

      - name: Upload the macOS stage
        uses: actions/upload-artifact@v7
        with:
          name: stage-macos
          path: stage-macos.tar.gz
          if-no-files-found: error

      - name: Upload the Linux and Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: assets-other
          path: dist/assets/*
          if-no-files-found: error

  macos:
    name: Sign, notarize and package macOS
    needs: [authorize, build]
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERSION: ${{ needs.authorize.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Download the macOS stage
        uses: actions/download-artifact@v8
        with:
          name: stage-macos

      - name: Extract the macOS stage
        run: |
          mkdir -p dist
          tar -xzf stage-macos.tar.gz -C dist
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Warn about missing Apple signing secrets
        if: env.APPLE_CERTIFICATE_BASE64 == ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          echo "::warning::macOS binaries will NOT be signed or notarized (ad hoc signature only). Users will need to manually allow them in System Settings."
          echo ""
          echo "To enable code signing, add the following secrets in Settings > Secrets and variables > Actions:"
          echo "1. APPLE_CERTIFICATE_BASE64: your 'Developer ID Application' certificate exported as .p12, base64-encoded"
          echo "2. APPLE_CERTIFICATE_PASSWORD: the password of the .p12 file"
          echo '3. APPLE_NOTARY_CREDENTIALS: {"apple_id": "...", "team_id": "XXXXXXXXXX", "app_specific_password": "xxxx-xxxx-xxxx-xxxx"}'

      - name: Setup macOS code signing keychain
        id: macos-keychain
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Signing with identity: $IDENTITY"
          echo "identity=$IDENTITY" >> $GITHUB_OUTPUT
          echo "keychain_path=$KEYCHAIN_PATH" >> $GITHUB_OUTPUT

      # The CLI, then the app (its seal covers the launcher and Info.plist).
      # Go binaries need no entitlement under the hardened runtime.
      - name: Sign the bundles
        env:
          IDENTITY: ${{ steps.macos-keychain.outputs.identity }}
        run: |
          if [ -n "$IDENTITY" ]; then
            SIGN=(codesign --force --options runtime --timestamp --sign "$IDENTITY")
          else
            SIGN=(codesign --force --sign -)
          fi
          for BUNDLE in dist/stage/darwin-*/frankenmanager; do
            "${SIGN[@]}" "$BUNDLE/frankenmanager"
            "${SIGN[@]}" "$BUNDLE/FrankenManager.app"
            codesign --verify --strict --verbose "$BUNDLE/frankenmanager"
            codesign --verify --deep --strict --verbose "$BUNDLE/FrankenManager.app"
          done

      - name: Notarize
        if: steps.macos-keychain.outputs.identity != ''
        env:
          APPLE_NOTARY_CREDENTIALS: ${{ secrets.APPLE_NOTARY_CREDENTIALS }}
        run: |
          APPLE_ID=$(jq -r .apple_id <<< "$APPLE_NOTARY_CREDENTIALS")
          TEAM_ID=$(jq -r .team_id <<< "$APPLE_NOTARY_CREDENTIALS")
          APP_PASSWORD=$(jq -r .app_specific_password <<< "$APPLE_NOTARY_CREDENTIALS")

          # notarytool takes a zip: both signed bundles (CLI and app)
          ZIP_PATH=$RUNNER_TEMP/frankenmanager.zip
          ditto -c -k --keepParent dist/stage "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait --timeout 15m
          echo "macOS bundles signed and notarized"

      - name: Cleanup macOS keychain
        if: always() && steps.macos-keychain.outputs.keychain_path != ''
        run: security delete-keychain "${{ steps.macos-keychain.outputs.keychain_path }}"

      # After signing: the archives and bare binaries hold the signed files
      - name: Package macOS
        run: go run ./cmd/release pack -out dist -targets darwin/amd64,darwin/arm64

      - name: Test the macOS bundle as installed
        run: |
          TEST_DIR=$RUNNER_TEMP/bundle-test
          mkdir -p "$TEST_DIR/bin"
          tar -xzf dist/assets/frankenmanager-macos-arm64.tar.gz -C "$TEST_DIR"
          ln -s "$TEST_DIR/frankenmanager/frankenmanager" "$TEST_DIR/bin/frankenmanager"
          test "$("$TEST_DIR/bin/frankenmanager" --version)" = "FrankenManager version $VERSION"
          # The app launcher used by the LaunchAgent reaches the CLI
          test "$("$TEST_DIR/frankenmanager/FrankenManager.app/Contents/MacOS/frankenmanager-agent" --version)" = "FrankenManager version $VERSION"
          codesign --verify --deep --strict "$TEST_DIR/frankenmanager/FrankenManager.app"

      - name: Upload the macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: assets-macos
          path: dist/assets/*
          if-no-files-found: error

  windows:
    name: Test the Windows bundle
    needs: [authorize, build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.authorize.outputs.version }}
    steps:
      - name: Download the Windows assets
        uses: actions/download-artifact@v8
        with:
          name: assets-other

      - name: Run the extracted executable
        shell: bash
        run: |
          mkdir -p bundle-test
          tar -xzf frankenmanager-windows-x86_64.tar.gz -C bundle-test
          test "$(./bundle-test/frankenmanager/frankenmanager.exe --version | tr -d '\r')" = "FrankenManager version $VERSION"
          ./bundle-test/frankenmanager/frankenmanager.exe --help > /dev/null

  create-release:
    name: Create GitHub Release
    needs: [authorize, build, macos, windows]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Download the assets
        uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          chmod +x frankenmanager-linux-* frankenmanager-macos-* 2>/dev/null || true
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      - name: Extract CHANGELOG for version
        id: changelog
        run: |
          VERSION="${{ needs.authorize.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_CONTENT=$(awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '$d' | tail -n +2)
            if [ -n "$CHANGELOG_CONTENT" ]; then
              echo "$CHANGELOG_CONTENT" > changelog_extract.md
              echo "has_content=true" >> $GITHUB_OUTPUT
            else
              echo "has_content=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_content=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release body
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
        run: |
          cat > release_body.md << 'EOF'
          ## What's Changed

          EOF

          if [ -n "${CHANGELOG_INPUT//[[:space:]]/}" ]; then
            NL=$'\n'
            printf '%s\n\n' "${CHANGELOG_INPUT//\\n/$NL}" >> release_body.md
          elif [ -f changelog_extract.md ] && [ "${{ steps.changelog.outputs.has_content }}" == "true" ]; then
            cat changelog_extract.md >> release_body.md
            echo "" >> release_body.md
          else
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes." >> release_body.md
            echo "" >> release_body.md
          fi

          cat >> release_body.md << 'EOF'

          ## Installation

          ### Quick Install (macOS/Linux)

          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/install.sh | bash
          ```

          Or pin to this specific version:

          ```bash
          VERSION=${{ needs.authorize.outputs.version }} curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/install.sh | bash
          ```

          ### Archives

          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | macOS | Apple Silicon | `frankenmanager-macos-arm64.tar.gz` |
          | macOS | Intel | `frankenmanager-macos-x86_64.tar.gz` |
          | Linux | x86_64 | `frankenmanager-linux-x86_64.tar.gz` |
          | Linux | arm64 | `frankenmanager-linux-arm64.tar.gz` |
          | Linux | armv7 | `frankenmanager-linux-armv7.tar.gz` |
          | Windows | x86_64 | `frankenmanager-windows-x86_64.tar.gz` |
          | Windows | arm64 | `frankenmanager-windows-arm64.tar.gz` |

          Each archive contains a `frankenmanager/` directory: keep it whole
          (on macOS it also holds `FrankenManager.app`) and put its
          `frankenmanager` executable on your PATH, e.g. with a symlink. The
          bare `frankenmanager-<platform>` executables are the same program,
          kept so that older single-file installs can self-update.
          `SHA256SUMS.txt` lists the checksums of every file.

          ## First-time Setup

          ```bash
          sudo frankenmanager setup --install-mkcert
          ```

          This configures passwordless `/etc/hosts` modifications and installs
          mkcert for SSL certificates. On Windows, run `frankenmanager setup`
          from an Administrator terminal.

          ## Verify Installation

          ```bash
          frankenmanager --version
          frankenmanager setup --status
          ```
          EOF

      - name: Resolve the release token of the triggering admin
        id: token
        env:
          RELEASE_TOKENS: ${{ secrets.RELEASE_TOKENS }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          TOKEN=$(jq -er --arg actor "$ACTOR" '.[$actor]' <<< "$RELEASE_TOKENS")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Created with the admin's own token, so the release and its tag (made
      # on the built commit) are authored by them, not by github-actions
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.token.outputs.token }}
          tag_name: v${{ needs.authorize.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FrankenManager v${{ needs.authorize.outputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ needs.authorize.outputs.prerelease == 'true' }}
          generate_release_notes: false
          files: |
            release-assets/*
          body_path: release_body.md
