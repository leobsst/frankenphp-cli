name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "caddy/**"
      - "php/**"
      - "docker/**"
      - ".env.example"
      - "install.sh"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  go-lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  go-test:
    name: Test (Go, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  go-build:
    name: Build (Go, 7 targets)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe needs the tags for the injected version
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Cross-compile every target without cgo
        run: make build-all

      - name: Package a release (dry run, Linux x86_64 and macOS arm64)
        run: go run ./cmd/release all -version 0.0.0-ci -targets linux/amd64,darwin/arm64

      - name: Check the injected version
        run: |
          expected="FrankenManager version $(git describe --tags --always --dirty | sed 's/^v//')"
          actual="$(bin/frankenmanager-linux-amd64 --version)"
          echo "$actual"
          test "$actual" = "$expected"

  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Create test environment
        run: |
          cp .env.example .env
          echo "USER=ci" >> .env
          echo "GROUP=ci" >> .env
          echo "MARIADB_ROOT_PASSWORD=testpassword" >> .env
          mkdir -p caddy/certs

      - name: Validate docker-compose.yml
        run: |
          CUSTOM_PATH=/home \
          DB_PORT=127.0.0.1:3306:3306 \
          PMA_PORT=127.0.0.1:8080:80 \
          REDIS_PORT=127.0.0.1:6379:6379 \
          MARIADB_ROOT_PASSWORD=test \
          docker compose config -q

      - name: Validate docker-compose-prod.yml
        run: |
          CUSTOM_PATH=/home \
          DB_PORT=127.0.0.1:3306:3306 \
          PMA_PORT=127.0.0.1:8080:80 \
          REDIS_PORT=127.0.0.1:6379:6379 \
          MARIADB_ROOT_PASSWORD=test \
          PWD=$(pwd) \
          docker compose -f docker-compose-prod.yml config -q
