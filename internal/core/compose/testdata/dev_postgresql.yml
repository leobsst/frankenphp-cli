services:
  db-postgresql:
    container_name: franken_postgresql
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: always
    volumes:
      - ${DATABASE_DIR:-./database}/postgresql:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT:-127.0.0.1:5432:5432}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - franken_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    container_name: franken_pgadmin
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - ${PGADMIN_PORT:-127.0.0.1:8081:80}
    depends_on:
      db-postgresql:
        condition: service_healthy
    networks:
      - franken_network

  cache:
    container_name: franken_redis
    image: redis:alpine
    restart: always
    command: redis-server
    ports:
      - ${REDIS_PORT:-127.0.0.1:6379:6379}
    networks:
      - franken_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy-proxy:
    container_name: franken-caddy-proxy
    image: caddy:2-alpine
    restart: always
    network_mode: host
    volumes:
      - ${CADDY_DIR:-./caddy}/Caddyfile:/etc/caddy/Caddyfile
      - ${CADDY_DIR:-./caddy}/certs:/certs
      - ${CADDY_DIR:-./caddy}/data:/data
      - ${CADDY_DIR:-./caddy}/config:/config
      - ${CADDY_DIR:-./caddy}/log:/var/log
    depends_on:
      franken-php-84:
        condition: service_started

  franken-php-84:
    container_name: frankenphp-8.4
    image: custom-frankenphp:8.4
    restart: always
    network_mode: host
    environment:
      WEB_HTTP_PORT: '8480'
      WEB_HTTPS_PORT: '8443'
    volumes:
      - ${CUSTOM_PATH}:/${CUSTOM_PATH}
      - ${CADDY_DIR:-./caddy}/Caddyfile.worker:/etc/caddy/Caddyfile
      - ${CADDY_DIR:-./caddy}/sites/php-8.4:/etc/caddy/sites/custom
      - ${CADDY_DIR:-./caddy}/certs:/certs
      - ${CADDY_DIR:-./caddy}/log:/var/log
      - ./php/8.4/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      db-postgresql:
        condition: service_healthy
      cache:
        condition: service_healthy

networks:
  franken_network:
    driver: bridge
