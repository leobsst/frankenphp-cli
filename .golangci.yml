version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
  settings:
    govet:
      settings:
        printf:
          # The translated printf wrapper, checked like fmt.Sprintf (i18n.Errorf
          # accepts %w, which this check would refuse)
          funcs:
            - github.com/leobsst/frankenphp-cli/internal/i18n.Tf
    errcheck:
      # Terminal output: nothing useful to do if a write to stdout fails
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/leobsst/frankenphp-cli
