openapi: 3.1.0
info:
  title: FrankenManager daemon API
  version: 1.0.0
  description: |
    The API of `frankenmanager daemon`, the source of the dashboard's TypeScript types.

    One router, three accesses:
    - the Unix socket `<data dir>/daemon.sock` (user only, no token), for the CLI;
    - HTTP on `127.0.0.1:DASHBOARD_PORT` (9081 by default), for the dashboard on
      this machine: the `Host` and `Origin` headers must be the local address, and
      the token of `<data dir>/daemon.token` is required. With
      `DASHBOARD_LOCAL_AUTH=true`, a session is required too (`X-FM-Session` header
      or `fm_session` cookie);
    - HTTPS on `DASHBOARD_REMOTE_PORT` (9443 by default) when `DASHBOARD_ACCESS` is
      `lan` (private networks) or `internet` (any address) and `DASHBOARD_PASSWORD`
      is set: the address must be allowed (`DASHBOARD_ALLOWED_IPS`), the `Origin`
      must be the address itself, and a session is required (`fm_session` cookie,
      or `Authorization: Bearer <session token>` for an app). Sign in with
      `POST /api/v1/auth/login`. There, the destructive actions (marked
      **Destructive**) need the password again in the `X-FM-Password` header
      (`428` without it, `403` when wrong). Five wrong passwords lock the address
      for 15 minutes (`429`).

    The routes are versioned under `/api/v1`; `/api/health` and `/api/daemon/stop`
    stay unversioned, so that any CLI can check and replace any daemon.

    The actions that change the shared state (database, Caddyfiles, hosts file,
    Docker) are operations; with `?verbose=true`, the image builds stream their
    output as events: the request answers `202` with the operation, queued.
    The operations run one at a time; follow them on `/api/v1/events` or
    `/api/v1/operations/{id}`. Their `result` is described with each action.

    Messages (errors, events) are in the daemon's language (`CLI_LANGUAGE`).
servers:
  - url: http://127.0.0.1:9081
    description: This machine
  - url: https://127.0.0.1:9444
    description: >-
      The dashboard of this machine (DASHBOARD_HTTPS_PORT), called by the page of https://frankenmanager.test and
      https://<CLI_ALIAS>.test only: signed in by POST /api/v1/auth/local, then with a Bearer session.
  - url: https://{host}:9443
    description: >-
      Remote access (DASHBOARD_ACCESS lan or internet). Besides its own origin, it answers the CORS requests of a
      mobile app (capacitor://localhost, https://localhost, http://localhost:<port>), signed in with a Bearer token.
    variables:
      host: { default: 192.168.1.10 }
security:
  - token: []
  - session: []
  - sessionBearer: []

tags:
  - name: daemon
  - name: stack
  - name: hosts
  - name: services
  - name: settings
  - name: network
  - name: s3
  - name: data
  - name: auth

paths:
  /api/health:
    get:
      tags: [daemon]
      summary: Version of the daemon
      responses:
        "200":
          description: The daemon answers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/daemon/stop:
    post:
      tags: [daemon]
      summary: Stop the daemon
      description: |
        Stops the daemon once the response is sent, after the requests in progress.
        The CLI uses it to replace a daemon of another version.
      responses:
        "428": { $ref: "#/components/responses/Confirm" }
        "202":
          description: The daemon stops.
          content:
            application/json:
              schema: { type: object }

  /api/v1/update:
    get:
      tags: [daemon]
      summary: Installed version, latest release and the notes in between
      description: |
        Looks up the releases on GitHub: the latest stable one (drafts and pre-releases
        are skipped) and the notes of every release newer than the daemon, among the last
        30 published. The answer is cached one hour (a failure, ten minutes): the
        dashboards may poll it. A development build reports the latest release but never
        an update.

        The update is not installed through the API: the binary lives in a system
        directory (e.g. `/usr/local/lib/frankenmanager`) that the daemon, run as the
        user, cannot write. Run `command` in a terminal of the host.
      parameters:
        - name: refresh
          in: query
          description: Look up GitHub again, bypassing the cache.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: >-
            The releases. When a lookup failed after an earlier one succeeded, the earlier
            answer, with `error`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateInfo" }
        "502":
          description: GitHub could not be reached, or its rate limit was reached, and no earlier answer is known.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: This daemon does not check for updates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/status:
    get:
      tags: [stack]
      summary: State of the stack, hosts and optional services
      description: |
        Answers within a few seconds even when Docker is stopped or stuck: `docker`
        is then false and the stack reported stopped. The dashboard tells "Docker
        unreachable" (200, `docker: false`) from "daemon gone" (no answer) by it.
      responses:
        "200":
          description: The current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/events:
    get:
      tags: [daemon]
      summary: Event stream (Server-Sent Events)
      description: |
        Sends `event: operation` with an `Operation` when one is queued, starts or
        finishes, and `event: event` with an `Event` for each step or message of a
        running operation, `event: containers` with the `Container` list of the stack
        when Docker reports a change (one event stream shared by every client),
        `event: docker` with a `DockerState` when Docker stops or comes back answering
        (checked every 5 s while it does not answer), and `event: s3.objects` with
        `{bucket}` after an upload. Comments (`: ping`) keep
        the stream open every 25 s.
        A slow client may miss messages: read the operation again.

        EventSource sends no header: pass the token as `access_token` instead,
        accepted on the streams and downloads only.
      security:
        - token: []
        - tokenQuery: []
      responses:
        "200":
          description: The stream, until the client leaves.
          content:
            text/event-stream:
              schema: { type: string }

  /api/v1/operations:
    get:
      tags: [daemon]
      summary: The last 100 operations, the latest first
      responses:
        "200":
          description: The operations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Operation" }

  /api/v1/operations/{id}:
    get:
      tags: [daemon]
      summary: An operation, with its events and result
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/stack/start:
    post:
      tags: [stack]
      summary: Start the stack
      description: "Operation `stack.start`, result `StartResult`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/stack/stop:
    post:
      tags: [stack]
      summary: Stop the stack and remove the hosts entries
      description: "Operation `stack.stop`, no result."
      responses:
        "428": { $ref: "#/components/responses/Confirm" }
        "202": { $ref: "#/components/responses/Queued" }

  /api/v1/stack/restart:
    post:
      tags: [stack]
      summary: Restart the stack, or some of its parts
      description: "Operation `stack.restart`, no result."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestartRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/containers:
    get:
      tags: [stack]
      summary: The containers of the stack and their state
      description: When Docker does not answer, every container is `not found` (see `Status.docker`).
      responses:
        "200":
          description: The containers the configuration runs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Container" }

  /api/v1/containers/{name}/{action}:
    post:
      tags: [stack]
      summary: Start, stop or restart one container of the stack
      description: "Operation `containers.<action>`, no result. A stopped container is kept, to start again."
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [start, stop, restart] }
      responses:
        "428": { $ref: "#/components/responses/Confirm" }
        "202": { $ref: "#/components/responses/Queued" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/stats:
    get:
      tags: [stack]
      summary: CPU and memory usage of the running containers of the stack
      description: "A snapshot (`docker stats --no-stream`): poll it for live values."
      responses:
        "200":
          description: The running containers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Stat" }

  /api/v1/logs:
    get:
      tags: [stack]
      summary: Log stream of the stack (Server-Sent Events)
      description: |
        Sends `event: log` with a `LogLine` for each line of the containers, starting
        with their last `tail` lines, until the client leaves. The lines of several
        containers interleave as they come. Like `/api/v1/events`, the token may be
        passed as `access_token`.
      security:
        - token: []
        - tokenQuery: []
      parameters:
        - name: container
          in: query
          description: A container of the stack, repeated; all of them when absent.
          schema:
            type: array
            items: { type: string }
          explode: true
        - name: tail
          in: query
          schema: { type: integer, default: 100, minimum: 0 }
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/hosts:
    post:
      tags: [hosts]
      summary: Add PHP, proxy or static hosts (stack running)
      description: |
        Operation `hosts.add`. With `target`: proxy hosts, result `ProxyResult`.
        With `static`: static hosts, result `StaticResult`. Otherwise PHP domains,
        result `PHPResult`. Hosts already registered are skipped: an empty result
        means nothing was added.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddHostsRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/hosts/remove:
    post:
      tags: [hosts]
      summary: Remove hosts (stack running)
      description: |
        Operation `hosts.remove`, result `RemoveResult`. The site files of a PHP
        domain or static host are archived; the aliases of a removed host are
        removed too.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostsRequest" }
      responses:
        "428": { $ref: "#/components/responses/Confirm" }
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/hosts/{name}/certificate:
    post:
      tags: [hosts]
      summary: Generate the certificate of a host again (stack running)
      description: |
        Operation `hosts.certificate`, no result. Whatever its age; the PHP container
        of a domain and the reverse proxy restart to use it.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "202": { $ref: "#/components/responses/Queued" }

  /api/v1/hosts/{name}/aliases:
    post:
      tags: [hosts]
      summary: Add alternate hosts to a domain or proxy host (stack running)
      description: "Operation `hosts.alias`, result `AliasResult`."
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasesRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/hosts/{name}/php:
    put:
      tags: [hosts]
      summary: Switch the PHP version of a domain (stack running)
      description: "Operation `hosts.php`, result `SwitchResult`. A failure rolls back."
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PHPRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/hosts/restore:
    post:
      tags: [hosts]
      summary: Restore archived domains (stack running)
      description: "Operation `hosts.restore`, result `PHPResult`, empty when nothing was restored."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/hosts/archived:
    get:
      tags: [hosts]
      summary: The archived hosts, ready to restore
      responses:
        "200":
          description: The archived hosts, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArchivedHost" }

  /api/v1/services:
    get:
      tags: [services]
      summary: The optional services
      responses:
        "200":
          description: Every optional service.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }

  /api/v1/services/{name}:
    put:
      tags: [services]
      summary: Enable or disable an optional service, live when the stack runs
      description: "Operation `services.set`, result `OptionalResult`."
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, enum: [dns, redis, s3, soketi] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/settings:
    get:
      tags: [settings]
      summary: Every setting
      parameters:
        - name: show_secrets
          in: query
          description: Show the passwords and secrets in clear.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The settings, in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Setting" }

  /api/v1/settings/{key}:
    put:
      tags: [settings]
      summary: Change a setting, or reset it with a null value
      description: |
        Operation `settings.set`, result `SettingResult`. An optional service is
        applied at once; the other changes tell how to apply them (`hint`).
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingRequest" }
      responses:
        "428": { $ref: "#/components/responses/Confirm" }
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/dns:
    get:
      tags: [network]
      summary: Whether the LAN DNS server is on and serves
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSState" }

  /api/v1/dns/apply:
    post:
      tags: [network]
      summary: Serve when DNS_SERVER=true, stop otherwise
      description: "Operation `dns.apply`, result `DNSState`. Reads the DNS_* settings again."
      responses:
        "202": { $ref: "#/components/responses/Queued" }

  /api/v1/dns/stop:
    post:
      tags: [network]
      summary: Stop the LAN DNS server until the next start or apply
      description: "Operation `dns.stop`, result `DNSState`."
      responses:
        "428": { $ref: "#/components/responses/Confirm" }
        "202": { $ref: "#/components/responses/Queued" }

  /api/v1/dns/clients:
    get:
      tags: [network]
      summary: The devices using the LAN DNS server
      parameters:
        - name: all
          in: query
          description: Also the idle devices (last 30 days).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The devices; none when the LAN DNS server is disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSClients" }

  /api/v1/ca:
    get:
      tags: [network]
      summary: Whether the root CA is shared on the LAN, and where
      responses:
        "200":
          description: The sharing state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CA" }
    put:
      tags: [network]
      summary: Start or stop sharing the root CA on the LAN
      description: "Operation `ca.set`, result `CA` (the URL of the QR code)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CARequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }

  /api/v1/s3:
    get:
      tags: [s3]
      summary: Endpoints and global key of the S3 server
      responses:
        "200":
          description: The S3 settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/S3" }

  /api/v1/s3/buckets:
    get:
      tags: [s3]
      summary: The buckets and their usage (S3 running)
      responses:
        "200":
          description: The buckets, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bucket" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      tags: [s3]
      summary: Create buckets
      description: |
        Operation `s3.buckets.create`, result `CreatedBuckets`: existing buckets
        are skipped. The global key is allowed on the new buckets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBucketsRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/s3/buckets/delete:
    post:
      tags: [s3]
      summary: Delete buckets and their own keys
      description: "Operation `s3.buckets.delete`, no result. A bucket with objects needs `force`: none is deleted otherwise."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketsRequest" }
      responses:
        "428": { $ref: "#/components/responses/Confirm" }
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/s3/buckets/empty:
    post:
      tags: [s3]
      summary: Delete every object of buckets
      description: "Operation `s3.buckets.empty`, no result. Confirm before calling."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketsRequest" }
      responses:
        "428": { $ref: "#/components/responses/Confirm" }
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/s3/buckets/public:
    post:
      tags: [s3]
      summary: Make buckets public or private
      description: "Operation `s3.buckets.public`, no result. Public: every object is readable without credentials."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketsRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/s3/keys:
    get:
      tags: [s3]
      summary: The access keys, without their secret
      parameters:
        - name: bucket
          in: query
          description: Only the keys allowed on this bucket.
          schema: { type: string }
      responses:
        "200":
          description: The access keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessKey" }
    post:
      tags: [s3]
      summary: Create an access key allowed on one bucket
      description: "Operation `s3.keys.create`, result `AccessKey` with its secret."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKeyRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/s3/keys/{id}:
    get:
      tags: [s3]
      summary: An access key, with its secret
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessKey" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/s3/keys/delete:
    post:
      tags: [s3]
      summary: Delete access keys
      description: "Operation `s3.keys.delete`, no result. None is deleted when one of them is the global key."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        "428": { $ref: "#/components/responses/Confirm" }
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/hosts/{name}/websocket:
    put:
      tags: [hosts]
      summary: Allow or refuse the WebSocket connections of a proxy host (stack running)
      description: "Operation `hosts.websocket`, result `{websocket}`. Refused, an upgrade request answers 403."
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }

  /api/v1/hosts/{name}/caddyfile:
    get:
      tags: [hosts]
      summary: The Caddyfile of a PHP domain or static host, and its template
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The site file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteFile" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      tags: [hosts]
      summary: Check, save and apply a Caddyfile (stack running)
      description: |
        Operation `hosts.caddyfile.save`, result `SiteFile`. Checked by the Caddy of the
        container serving it (`adapt`): nothing is written when Caddy refuses it. Then
        the PHP container of the domain (or the reverse proxy) restarts.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/hosts/{name}/caddyfile/validate:
    post:
      tags: [hosts]
      summary: Check a Caddyfile without saving it
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteRequest" }
      responses:
        "200":
          description: Caddy takes it.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
        "409": { $ref: "#/components/responses/Error" }
        "422":
          description: Caddy refuses it; the error carries its message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/hosts/{name}/caddyfile/reset:
    post:
      tags: [hosts]
      summary: Write a Caddyfile from its template again (stack running)
      description: "**Destructive.** Operation `hosts.caddyfile.reset`, result `SiteFile`. A PHP domain keeps its root."
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "428": { $ref: "#/components/responses/Confirm" }

  /api/v1/redis:
    get:
      tags: [data]
      summary: State of the Redis cache
      responses:
        "200":
          description: The state; info when it runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedisState" }

  /api/v1/redis/keys:
    get:
      tags: [data]
      summary: A page of keys (SCAN)
      parameters:
        - { name: pattern, in: query, schema: { type: string, default: "*" } }
        - { name: cursor, in: query, schema: { type: string, default: "0" }, description: "From the previous page; \"0\" after the last one." }
        - { name: count, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedisPage" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/redis/keys/delete:
    post:
      tags: [data]
      summary: Delete keys
      description: "**Destructive.** Operation `redis.keys.delete`, result `{deleted}`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys: { type: array, items: { type: string } }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "428": { $ref: "#/components/responses/Confirm" }

  /api/v1/redis/flush:
    post:
      tags: [data]
      summary: Delete every key (FLUSHALL)
      description: "**Destructive.** Operation `redis.flush`, no result."
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "428": { $ref: "#/components/responses/Confirm" }

  /api/v1/databases:
    get:
      tags: [data]
      summary: The database servers, their databases and users
      description: The system databases and accounts are left out.
      responses:
        "200":
          description: The servers of DB_ENGINES.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabasesState" }

  /api/v1/databases/{engine}:
    post:
      tags: [data]
      summary: Create a database
      description: "Operation `databases.create`, no result. utf8mb4 on MariaDB and MySQL, UTF8 on PostgreSQL."
      parameters:
        - $ref: "#/components/parameters/Engine"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: "^[A-Za-z0-9_]{1,63}$" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/databases/{engine}/delete:
    post:
      tags: [data]
      summary: Delete databases
      description: "**Destructive.** Operation `databases.delete`, no result."
      parameters:
        - $ref: "#/components/parameters/Engine"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamesRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "428": { $ref: "#/components/responses/Confirm" }

  /api/v1/databases/{engine}/users:
    post:
      tags: [data]
      summary: Create a user, with every privilege on a database
      description: |
        Operation `databases.users.create`, no result. On MariaDB and MySQL the user
        connects from anywhere (`'%'`); on PostgreSQL it owns the database.
      parameters:
        - $ref: "#/components/parameters/Engine"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string, pattern: "^[A-Za-z0-9_]{1,63}$" }
                password: { type: string }
                database: { type: string }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/databases/{engine}/users/delete:
    post:
      tags: [data]
      summary: Delete users
      description: "**Destructive.** Operation `databases.users.delete`, no result."
      parameters:
        - $ref: "#/components/parameters/Engine"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamesRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "428": { $ref: "#/components/responses/Confirm" }

  /api/v1/s3/buckets/{bucket}/objects:
    get:
      tags: [s3]
      summary: The objects of a bucket, one folder deep
      parameters:
        - { name: bucket, in: path, required: true, schema: { type: string } }
        - { name: prefix, in: query, schema: { type: string }, description: "The folder, ending with /." }
        - { name: token, in: query, schema: { type: string }, description: The next_token of the previous page. }
      responses:
        "200":
          description: A page of at most 1000 objects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectPage" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/s3/buckets/{bucket}/object:
    get:
      tags: [s3]
      summary: Download an object (attachment)
      description: Like the streams, the token may be passed as `access_token`.
      security:
        - token: []
        - tokenQuery: []
        - session: []
        - sessionBearer: []
      parameters:
        - { name: bucket, in: path, required: true, schema: { type: string } }
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The object.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [s3]
      summary: Upload an object (the request body, streamed; 5 GiB at most)
      parameters:
        - { name: bucket, in: path, required: true, schema: { type: string } }
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: public, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The object stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectInfo" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/s3/buckets/{bucket}/object/link:
    get:
      tags: [s3]
      summary: Where an object is read
      description: Its public URL, or a temporary presigned one for a private object.
      parameters:
        - { name: bucket, in: path, required: true, schema: { type: string } }
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: expires, in: query, schema: { type: integer, default: 3600, maximum: 604800 }, description: Seconds, temporary links only. }
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectLink" }

  /api/v1/s3/buckets/{bucket}/objects/delete:
    post:
      tags: [s3]
      summary: Delete objects
      description: "**Destructive.** Operation `s3.objects.delete`, no result."
      parameters:
        - { name: bucket, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectsRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "428": { $ref: "#/components/responses/Confirm" }

  /api/v1/s3/buckets/{bucket}/objects/public:
    post:
      tags: [s3]
      summary: Make objects public-read or private (ACL)
      description: "Operation `s3.objects.public`, no result."
      parameters:
        - { name: bucket, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectsRequest" }
      responses:
        "202": { $ref: "#/components/responses/Queued" }

  /api/v1/host:
    get:
      tags: [auth]
      summary: The machine the daemon runs on, and how the request reached it
      responses:
        "200":
          description: The host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostInfo" }

  /api/v1/auth:
    get:
      tags: [auth]
      summary: The access to the dashboard, and whether this client is signed in
      security: [{}]
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthState" }

  /api/v1/auth/local:
    post:
      tags: [auth]
      summary: Sign in the dashboard of this machine
      description: >-
        On https://127.0.0.1:DASHBOARD_HTTPS_PORT only, from the page of https://frankenmanager.test or
        https://<CLI_ALIAS>.test (Origin checked): opens a session without the password and answers its token, sent
        then as Authorization: Bearer. No cookie. Refused (403) with DASHBOARD_LOCAL_AUTH and a password, which then
        signs in with POST /api/v1/auth/login. Elsewhere, or without Origin: 404.
      security: [{}]
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [token, session]
                properties:
                  token: { type: string }
                  session: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in with the dashboard password
      description: Sets the `fm_session` cookie and answers the token for an app.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                device: { type: string, description: Shown in the sessions; the User-Agent when empty. }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [token, session]
                properties:
                  token: { type: string }
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: End the session of this client
      responses:
        "200":
          description: Signed out.

  /api/v1/auth/password:
    put:
      tags: [auth]
      summary: Set or change the dashboard password
      description: |
        Operation `auth.password`, result `{password_set}`. A change needs the current
        password; the first one can only be set on the host. Every device is signed out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                current: { type: string }
                password: { type: string, minLength: 10 }
      responses:
        "202": { $ref: "#/components/responses/Queued" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/auth/sessions:
    get:
      tags: [auth]
      summary: The signed-in devices
      responses:
        "200":
          description: Most recently used first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionInfo" }

  /api/v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Sign a device out
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Revoked.
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/auth/log:
    get:
      tags: [auth]
      summary: The latest connection events (the last 1000 are kept)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessEntry" }

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: The content of `<data dir>/daemon.token`. Not required on the Unix socket.
    tokenQuery:
      type: apiKey
      in: query
      name: access_token
      description: The token (or, remotely, the session token), on the streams and object downloads only.
    session:
      type: apiKey
      in: cookie
      name: fm_session
      description: The session of a browser, set by `POST /api/v1/auth/login` (HttpOnly, SameSite=Strict).
    sessionBearer:
      type: http
      scheme: bearer
      description: Remote access, an app - the token answered by `POST /api/v1/auth/login`.

  responses:
    Queued:
      description: The operation, queued.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Operation" }
    Error:
      description: The request failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Confirm:
      description: "Remote access: the X-FM-Password header is missing (428), wrong (403), or the address is locked (429)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid token or session (401), or forbidden address, Host or Origin (403).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }


  parameters:
    Engine:
      name: engine
      in: path
      required: true
      schema: { type: string, enum: [mariadb, mysql, postgresql] }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Health:
      type: object
      required: [version]
      properties:
        version: { type: string }

    Operation:
      type: object
      required: [id, kind, status, events, created]
      properties:
        id: { type: string, examples: [op-12] }
        kind:
          type: string
          description: The action, e.g. `hosts.add`.
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        error: { type: string, description: The error of a failed operation. }
        reported: { type: boolean, description: The events already report the error and its cleanup. }
        result:
          description: The result of a succeeded operation; its schema depends on `kind`.
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        created: { type: string, format: date-time }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time }

    Event:
      type: object
      required: [operation, kind, level, time]
      properties:
        operation: { type: string }
        kind:
          type: string
          enum: [message, step, break, output]
          description: |
            A step starts a stage of the operation; a break separates two parts of the
            output; an output is raw output of a program (image build), printed as is.
        level:
          type: string
          enum: [info, success, warning, error]
        message: { type: string }
        time: { type: string, format: date-time }

    Container:
      type: object
      required: [name, state, health]
      properties:
        name: { type: string }
        state: { type: string, description: "`running`, `exited`, `not found`..." }
        health: { type: string, enum: [healthy, unhealthy, starting, N/A] }

    Stat:
      type: object
      required: [name, cpu_percent, mem_percent, mem_usage, net_io, block_io]
      properties:
        name: { type: string }
        cpu_percent: { type: number }
        mem_percent: { type: number }
        mem_usage: { type: string, examples: ["52.3MiB / 7.66GiB"] }
        net_io: { type: string }
        block_io: { type: string }

    LogLine:
      type: object
      required: [container, time, line]
      properties:
        container: { type: string }
        time: { type: string, format: date-time, description: Zero when docker gave none. }
        line: { type: string }

    Host:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [php, proxy, static, alias]
        php: { type: string, description: PHP version of a PHP domain. }
        target: { type: string, description: Upstream of a proxy host, target of an alias. }
        root: { type: string, description: Directory of a static host, relative to the projects root. }
        spa: { type: boolean }
        websocket: { type: boolean, description: "Proxy host: forwards the WebSocket connections." }

    Service:
      type: object
      required: [name, setting, enabled, state]
      properties:
        name: { type: string, enum: [dns, redis, s3, soketi] }
        setting: { type: string, description: Its setting, e.g. `REDIS_ENABLED`. }
        enabled: { type: boolean }
        state:
          type: string
          description: State of its container (`running`, `exited`, empty when absent), or of the LAN DNS process (`running`, `stopped`).

    Status:
      type: object
      required: [running, docker, hosts, services]
      properties:
        running: { type: boolean }
        docker: { type: boolean, description: "The Docker engine answers. When false, `running` is false." }
        hosts:
          type: array
          items: { $ref: "#/components/schemas/Host" }
        services:
          type: array
          items: { $ref: "#/components/schemas/Service" }

    DockerState:
      type: object
      required: [reachable]
      description: Message `docker` of the event stream.
      properties:
        reachable: { type: boolean, description: The Docker engine answers. }

    Domain:
      type: object
      required: [name, php]
      properties:
        name: { type: string }
        php: { type: string }

    StaticHost:
      type: object
      required: [domain, root, spa]
      properties:
        domain: { type: string }
        root: { type: string }
        spa: { type: boolean }

    StartRequest:
      type: object
      properties:
        domains:
          type: [array, "null"]
          items: { type: string }
          description: Domains added with `php`; null starts the registered ones.
        path: { type: string, description: Projects root, empty for DEFAULT_PROJECT_PATH. }
        php: { type: string, description: Version of the new domains, empty for DEFAULT_PHP_VERSION. }
        force_ssl: { type: boolean }
        build: { type: boolean, description: Rebuild the PHP images even when up to date. }

    StartResult:
      type: object
      required: [domains, versions, statics, dns_listen, watched]
      properties:
        domains:
          type: array
          items: { $ref: "#/components/schemas/Domain" }
        versions:
          type: array
          items: { type: string }
        statics:
          type: array
          items: { $ref: "#/components/schemas/StaticHost" }
        dns_listen: { type: string, description: Address of the LAN DNS server, empty when disabled. }
        watched: { type: boolean, description: The domains follow the LAN IP of the machine. }

    RestartRequest:
      type: object
      properties:
        targets:
          type: array
          items:
            type: string
            enum: [caddy, database, cache, phpmyadmin, dns, soketi, s3]
          description: Empty restarts everything.
        force_ssl: { type: boolean }
        build:
          type: boolean
          description: |
            Rebuild the images of the active PHP versions first, and recreate their
            containers on them (needs DEFAULT_PROJECT_PATH or a path known from the
            last start). With `targets: [caddy]`, only the FrankenPHP containers and
            the reverse proxy restart: what the dashboard's "rebuild" does.

    AddHostsRequest:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items: { type: string }
        php: { type: string, description: PHP version, empty for DEFAULT_PHP_VERSION. }
        root: { type: string, description: Directory served, relative to the projects root; its first directory must exist. }
        target: { type: string, description: Makes proxy hosts forwarding to this upstream. }
        websocket: { type: boolean, default: true, description: "With target: false refuses the WebSocket connections (403)." }
        static: { type: boolean }
        spa: { type: boolean, description: Static only; unknown paths fall back to /index.html. }
        force_ssl: { type: boolean }

    PHPResult:
      type: object
      required: [domains, php]
      properties:
        domains:
          type: [array, "null"]
          items: { type: string }
        php: { type: string }

    ProxyResult:
      type: object
      required: [domains, target]
      properties:
        domains:
          type: [array, "null"]
          items: { type: string }
        target: { type: string }

    StaticResult:
      type: object
      required: [hosts, project_path, site_dir]
      properties:
        hosts:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/StaticHost" }
        project_path: { type: string }
        site_dir: { type: string, description: Directory of the editable site files. }

    AliasesRequest:
      type: object
      required: [aliases]
      properties:
        aliases:
          type: array
          items: { type: string }
        force_ssl: { type: boolean }

    AliasResult:
      type: object
      required: [aliases, target, serves]
      properties:
        aliases:
          type: [array, "null"]
          items: { type: string }
        target: { type: string }
        serves: { type: string, description: "`PHP 8.4` or `proxy <upstream>`." }

    RemoveResult:
      type: object
      required: [domains, aliases, proxies, statics, archive_dir, static_archive_dir]
      properties:
        domains:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Domain" }
        aliases:
          type: [array, "null"]
          items: { type: string }
        proxies:
          type: [array, "null"]
          items: { type: string }
        statics:
          type: [array, "null"]
          items: { type: string }
        archive_dir: { type: string }
        static_archive_dir: { type: string }

    PHPRequest:
      type: object
      properties:
        php: { type: string, description: Empty for DEFAULT_PHP_VERSION. }

    SwitchResult:
      type: object
      required: [domain, from, to, switched]
      properties:
        domain: { type: string }
        from: { type: string }
        to: { type: string }
        switched: { type: boolean, description: False when the domain already used this version. }

    RestoreRequest:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items: { type: string }
        php: { type: string, description: "Restores PHP domains with this version (not the original one). One of php and static is required." }
        static: { type: boolean, description: Restores static hosts, with the root and fallback of their site file. }
        force_ssl: { type: boolean }

    HostsRequest:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items: { type: string }

    ArchivedHost:
      type: object
      required: [domain, kind]
      properties:
        domain: { type: string }
        kind:
          type: string
          enum: [php, static]
          description: Kept in sites/archive/php-<v>/ or sites/archive/static/.
        php: { type: string, description: The version it was served with. }

    ServiceRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    OptionalResult:
      type: object
      required: [name, enabled, changed, live]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        changed: { type: boolean, description: False when it was already in that state. }
        live: { type: boolean, description: Applied to the running stack; otherwise on the next start. }

    Setting:
      type: object
      required: [key, value, default, description, custom, secret, apply, applies]
      properties:
        key: { type: string }
        value: { type: string, description: "`********` for a set secret, unless show_secrets." }
        default: { type: string }
        description: { type: string }
        values:
          type: array
          items: { type: string }
          description: The accepted values, absent when free.
        custom: { type: boolean, description: Set, not the default. }
        secret: { type: boolean }
        apply:
          type: string
          enum: [now, live, alias, recreate, rebuild, restart_dns, restart_db, daemon]
        applies: { type: string, description: Label of `apply`, in the daemon's language. }
        hint: { type: string, description: The command that applies a change. }

    SettingRequest:
      type: object
      required: [value]
      properties:
        value:
          type: [string, "null"]
          description: The new value, null to reset the default.

    SettingResult:
      type: object
      required: [key, value, changed]
      properties:
        key: { type: string }
        value: { type: string }
        changed: { type: boolean }
        service:
          $ref: "#/components/schemas/OptionalResult"
          description: What happened to the optional service of the setting, applied at once.
        hint: { type: string, description: How to apply the change otherwise. }

    DNSState:
      type: object
      required: [enabled, running]
      properties:
        enabled: { type: boolean, description: DNS_SERVER. }
        running: { type: boolean, description: The daemon serves it. }

    DNSClient:
      type: object
      required: [ip, name, mac, first_seen, last_seen, queries, status, randomized_mac]
      properties:
        ip: { type: string }
        name: { type: string, description: "Empty when unknown, `this machine` for the host." }
        mac: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        queries: { type: integer, format: int64 }
        status: { type: string, enum: [connected, idle] }
        randomized_mac: { type: boolean, description: A private MAC address, which changes per network. }

    DNSClients:
      type: object
      required: [enabled, state, connected, devices]
      properties:
        enabled: { type: boolean }
        state: { type: string, description: State of the LAN DNS process, empty when disabled. }
        connected: { type: integer }
        devices:
          type: array
          items: { $ref: "#/components/schemas/DNSClient" }

    CA:
      type: object
      required: [sharing]
      properties:
        sharing: { type: boolean }
        port: { type: integer }
        url: { type: string, description: Where the other devices download the root CA (QR code). }

    CARequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        port: { type: integer, description: "0 for the default (9080)." }

    S3:
      type: object
      required: [enabled, domain, app_endpoint, region, access_key_id]
      properties:
        enabled: { type: boolean }
        domain: { type: string, description: HTTPS host of the S3 API. }
        app_endpoint: { type: string, description: Endpoint of the PHP apps. }
        region: { type: string }
        access_key_id: { type: string, description: The global key, allowed on every bucket. }

    Bucket:
      type: object
      required: [name, public, objects, public_objects, bytes, keys, url]
      properties:
        name: { type: string }
        public: { type: boolean }
        objects: { type: integer, format: int64 }
        public_objects: { type: integer, description: "Objects stored public-read, -1 for a public bucket (all)." }
        bytes: { type: integer, format: int64 }
        keys: { type: integer, description: Its own keys, without the global one. }
        url: { type: string }

    CreateBucketsRequest:
      type: object
      required: [names]
      properties:
        names:
          type: array
          items: { type: string }
        public: { type: boolean }

    CreatedBuckets:
      type: object
      required: [created]
      properties:
        created:
          type: array
          items: { type: string }

    BucketsRequest:
      type: object
      required: [names]
      properties:
        names:
          type: array
          items: { type: string }
        force: { type: boolean, description: "delete: empty the buckets with objects first." }
        public: { type: boolean, description: "public: make them public, or private." }

    Grant:
      type: object
      required: [bucket, read, write, owner]
      properties:
        bucket: { type: string }
        read: { type: boolean }
        write: { type: boolean }
        owner: { type: boolean }

    AccessKey:
      type: object
      required: [id, name, global, grants]
      properties:
        id: { type: string }
        name: { type: string }
        secret: { type: string, description: Only when created or shown. }
        global: { type: boolean }
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }

    CreateKeyRequest:
      type: object
      required: [bucket]
      properties:
        bucket: { type: string }
        name: { type: string, description: "Stored as `<bucket>/<name>`, `app` when empty." }
        read_only: { type: boolean }

    SiteRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }

    SiteFile:
      type: object
      required: [host, kind, path, content, template, modified]
      properties:
        host: { type: string }
        kind: { type: string, enum: [php, static] }
        php: { type: string }
        path: { type: string }
        content: { type: string, description: The file as it is. }
        template: { type: string, description: What the template gives (a PHP domain keeps its root). }
        modified: { type: boolean, description: Content differs from the template. }

    RedisState:
      type: object
      required: [enabled, running]
      properties:
        enabled: { type: boolean }
        running: { type: boolean }
        info:
          type: object
          required: [version, uptime_seconds, used_memory, connected_clients, keys, hits, misses]
          properties:
            version: { type: string }
            uptime_seconds: { type: integer }
            used_memory: { type: string, examples: ["1.05M"] }
            connected_clients: { type: integer }
            keys: { type: integer }
            hits: { type: integer }
            misses: { type: integer }

    RedisPage:
      type: object
      required: [keys, cursor]
      properties:
        cursor: { type: string, description: "\"0\" after the last page." }
        keys:
          type: array
          items:
            type: object
            required: [name, type, ttl]
            properties:
              name: { type: string }
              type: { type: string, examples: [string, hash, list] }
              ttl: { type: integer, description: Seconds, -1 without expiration. }

    DatabasesState:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            type: object
            required: [engine, container, running, databases, users]
            properties:
              engine: { type: string, enum: [mariadb, mysql, postgresql] }
              container: { type: string }
              running: { type: boolean }
              databases:
                type: array
                items: { type: string }
              users:
                type: array
                items:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    host: { type: string, description: "MariaDB and MySQL: '%', localhost..." }
        admin_url: { type: string, description: phpMyAdmin or pgAdmin (development). }

    NamesRequest:
      type: object
      required: [names]
      properties:
        names:
          type: array
          items: { type: string }

    ObjectInfo:
      type: object
      required: [key, size, last_modified, etag, public]
      properties:
        key: { type: string }
        size: { type: integer }
        last_modified: { type: string, format: date-time }
        etag: { type: string }
        public: { type: boolean, description: Readable by everyone (its ACL, or a public bucket). }
        url: { type: string, description: Where everyone reads it, public objects only. }

    ObjectPage:
      type: object
      required: [bucket, prefix, folders, objects]
      properties:
        bucket: { type: string }
        prefix: { type: string }
        folders:
          type: array
          items: { type: string }
        objects:
          type: array
          items: { $ref: "#/components/schemas/ObjectInfo" }
        next_token: { type: string }

    ObjectLink:
      type: object
      required: [url, public]
      properties:
        url: { type: string }
        public: { type: boolean }
        expires_at: { type: string, format: date-time, description: Temporary links only. }

    ObjectsRequest:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { type: string }
        public: { type: boolean, description: "objects/public: public-read, or private." }

    AuthState:
      type: object
      required: [mode, password_set, local_auth, remote_port, remote_active, remote, session_required, authenticated]
      properties:
        mode: { type: string, enum: [local, lan, internet] }
        password_set: { type: boolean }
        local_auth: { type: boolean }
        remote_port: { type: integer }
        remote_active: { type: boolean, description: The remote access listens. }
        remote: { type: boolean, description: This request came through the remote access. }
        session_required: { type: boolean }
        authenticated: { type: boolean }

    Session:
      type: object
      required: [id, device, ip, remote, created, last_seen]
      properties:
        id: { type: string }
        device: { type: string }
        ip: { type: string }
        remote: { type: boolean }
        created: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }

    SessionInfo:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          required: [current]
          properties:
            current: { type: boolean }

    AccessEntry:
      type: object
      required: [at, ip, event, remote]
      properties:
        at: { type: string, format: date-time }
        ip: { type: string }
        event:
          type: string
          enum: [login, login_failed, logout, revoked, refused, confirm_failed, password_failed, password_changed]
        device: { type: string }
        remote: { type: boolean }

    HostInfo:
      type: object
      required: [hostname, os, arch, version, remote, mode]
      properties:
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        version: { type: string }
        lan_ip: { type: string }
        remote: { type: boolean, description: The request came through the remote access (badge Local / Remote). }
        mode: { type: string, enum: [local, lan, internet] }
        remote_url: { type: string, description: Where the remote access answers, when on. }

    UpdateInfo:
      type: object
      required: [version, latest, update_available, releases, command, checked_at]
      properties:
        version: { type: string, description: The version of the daemon. }
        latest:
          type: [string, "null"]
          description: The latest stable release, null when GitHub lists none.
        update_available: { type: boolean }
        releases:
          type: array
          description: The releases newer than `version`, newest first.
          items: { $ref: "#/components/schemas/ReleaseNotes" }
        command:
          type: string
          description: The command installing the update in a terminal of the host (it needs administrator rights).
          examples: [sudo frankenmanager update]
        checked_at: { type: string, format: date-time }
        error:
          type: string
          description: The failure of the last lookup, when this answer comes from an earlier one.

    ReleaseNotes:
      type: object
      required: [version, name, published_at, url, notes]
      properties:
        version: { type: string, examples: ["0.13.1"] }
        name: { type: string }
        published_at: { type: string, format: date-time }
        url: { type: string, description: The page of the release on GitHub. }
        notes: { type: string, description: The body of the GitHub release (Markdown). }
