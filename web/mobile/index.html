<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale: no automatic zoom of iOS on a focused field (text under 16px, see theme.ts). Pinching stays
      possible: Safari ignores the limit for the user, and so does the iOS app (ignoresViewportScaleLimits); elsewhere
      the limit is removed (app/src/lib/viewport.ts).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4F1895" />
    <!-- Manifest and icons (public/, generated by `pnpm assets`): install as a web app. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/webp" href="assets/icons/icon-48.webp" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.webp" />
    <title>FrankenManager</title>
    <!--
      HTML splash screen: the same image as the native screen (cover, like iOS scaleAspectFill), taking over without a
      visible transition, with a spinner below the logo. It is there before any JavaScript, and src/lib/splash.ts
      removes it when the app is ready.
    -->
    <style>
      #fm-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        background: #4f1895 url(splash/splash.webp) center / cover no-repeat;
        transition: opacity 0.3s ease;
      }
      #fm-splash.fm-splash-out { opacity: 0; pointer-events: none; }
      /* Below the logo: the square image covers the screen, so 1% of the image = 1% of the longest side of the screen. */
      #fm-splash span {
        position: absolute; left: 50%; top: calc(50% + 0.27 * max(100vw, 100vh));
        width: 30px; height: 30px; margin: -15px 0 0 -15px; box-sizing: border-box;
        border: 3px solid rgb(255 255 255 / 0.25); border-top-color: #fff; border-radius: 50%;
        animation: fm-spin 0.8s linear infinite;
      }
      @keyframes fm-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #fm-splash { background-color: #2e2a40; background-image: url(splash/splash-dark.webp); }
      }
      @media (prefers-reduced-motion: reduce) {
        #fm-splash span { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="fm-splash" role="progressbar" aria-label="Chargement de FrankenManager"><span></span></div>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
