<!doctype html>
<!--
  Hero image of the store (first screenshot), rendered by hero.mjs at the size of each device: app icon and headline
  over the brand gradient, above two devices (overview in light, containers in dark). Query: w, h, lang (en,
  fr), kind (phone, duo, tablet), ratio, icon, light, dark.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --w: 1206px; --h: 2622px; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #fff;
    background:
      radial-gradient(120% 70% at 85% 8%, rgba(167, 112, 255, .55), transparent 60%),
      radial-gradient(90% 60% at 0% 100%, rgba(37, 99, 235, .45), transparent 65%),
      linear-gradient(165deg, #5b1fa8 0%, #3c1475 48%, #1d0b3d 100%);
    position: relative;
  }
  /* Faint grid, like a terminal sheet */
  body::before {
    content: ""; position: absolute; inset: 0; opacity: .09;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: calc(var(--u) * 6) calc(var(--u) * 6);
    mask-image: linear-gradient(to bottom, #000, transparent 55%);
  }
  .copy { position: absolute; left: 0; right: 0; top: calc(var(--u) * 7); padding: 0 calc(var(--u) * 6); text-align: center; z-index: 2; }
  .icon { width: calc(var(--u) * 11); height: calc(var(--u) * 11); border-radius: 22.5%; box-shadow: 0 calc(var(--u) * 1.2) calc(var(--u) * 4) rgba(0,0,0,.35); }
  h1 { margin-top: calc(var(--u) * 4); font-size: calc(var(--u) * 8); line-height: 1.04; font-weight: 800; letter-spacing: -0.03em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #d9c2ff, #8fb4ff); -webkit-background-clip: text; color: transparent; }
  p.sub { margin: calc(var(--u) * 2.6) auto 0; max-width: 22em; font-size: calc(var(--u) * 3); line-height: 1.35; color: rgba(255,255,255,.82); font-weight: 500; }
  /* Devices */
  .stage { position: absolute; left: 0; right: 0; bottom: 0; top: var(--stage-top); }
  .device { position: absolute; border-radius: var(--r); padding: var(--bezel); background: #0b0b10;
    box-shadow: 0 0 0 calc(var(--u) * .35) #2a2a35, 0 calc(var(--u) * 4) calc(var(--u) * 9) rgba(0,0,0,.5); }
  .device img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: calc(var(--r) - var(--bezel)); }
</style>
</head>
<body>
<div class="copy">
  <img class="icon" id="icon" alt="">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
</div>
<div class="stage" id="stage"></div>
<script>
  const q = new URLSearchParams(location.search)
  const W = +q.get('w'), H = +q.get('h'), lang = q.get('lang'), kind = q.get('kind')
  const root = document.documentElement.style
  root.setProperty('--w', W + 'px'); root.setProperty('--h', H + 'px')
  // Unit: 1 % of the width, a bit less on the wide canvases (iPad, Duo) so the copy keeps its proportions.
  const u = Math.min(W, H * 0.56) / 100
  root.setProperty('--u', u + 'px')
  const T = {
    en: { title: 'Your PHP stack,<br><em>in your pocket.</em>', sub: 'Projects, containers, HTTPS and services of every FrankenManager machine, from your phone.' },
    fr: { title: 'Votre stack PHP,<br><em>dans votre poche.</em>', sub: 'Projets, conteneurs, HTTPS et services de chaque machine FrankenManager, depuis votre téléphone.' },
  }[lang]
  document.getElementById('title').innerHTML = T.title
  document.getElementById('sub').textContent = T.sub
  document.getElementById('icon').src = q.get('icon')

  // Two devices: the light screen in front on the left, the dark one behind on the right.
  const stage = document.getElementById('stage')
  const add = (src, { w, ratio, left, top, rot, z, r, bezel }) => {
    const d = document.createElement('div')
    d.className = 'device'
    Object.assign(d.style, { width: w + 'px', height: w / ratio + 'px', left: left + 'px', top: top + 'px', transform: `rotate(${rot}deg)`, zIndex: z })
    d.style.setProperty('--r', r + 'px'); d.style.setProperty('--bezel', bezel + 'px')
    const img = document.createElement('img'); img.src = src; d.appendChild(img); stage.appendChild(d)
  }
  const ratio = +q.get('ratio')
  const tablet = kind === 'tablet'
  // The devices start below the copy, whatever its height.
  const copyBottom = document.querySelector('.copy').getBoundingClientRect().bottom
  root.setProperty('--stage-top', copyBottom + u * 6 + 'px')
  const w = W * (tablet ? 0.6 : kind === 'duo' ? 0.46 : 0.57)
  const r = w * (tablet ? 0.045 : 0.13), bezel = w * (tablet ? 0.02 : 0.03)
  add(q.get('dark'), { w, ratio, left: W * (tablet ? 0.36 : kind === 'duo' ? 0.47 : 0.4), top: u * 5, rot: 6, z: 1, r, bezel })
  add(q.get('light'), { w, ratio, left: W * (tablet ? 0.04 : kind === 'duo' ? 0.07 : 0.03), top: 0, rot: -5, z: 2, r, bezel })
</script>
</body>
</html>
