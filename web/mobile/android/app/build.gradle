apply plugin: 'com.android.application'

// Per-developer settings, never committed: environment variables, or web/mobile/.env.local (same file as the iOS
// signing, see .env.example). The environment wins over the file.
def localEnv = [:]
def envFile = rootProject.file('../.env.local')
if (envFile.exists()) {
    envFile.eachLine { line ->
        def m = line =~ /^\s*([A-Z0-9_]+)\s*=\s*(.*?)\s*$/
        if (m.matches()) localEnv[m.group(1)] = m.group(2).replaceAll(/^["']|["']$/, '')
    }
}
def setting = { String key -> System.getenv(key) ?: localEnv[key] ?: null }

// Version and build number written by scripts/app-version.mjs (before `pnpm android`, or `pnpm version:sync`):
// APP_VERSION and APP_BUILD, otherwise the last mobile-vX.Y.Z git tag and the commit count.
def appVersion = new Properties()
def versionFile = rootProject.file('version.local.properties')
if (versionFile.exists()) versionFile.withInputStream { appVersion.load(it) }

android {
    // Package of the code (MainActivity, SecureStorePlugin): fixed. The id of the installed app can be changed.
    namespace = "dev.frankenmanager.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId setting('ANDROID_APPLICATION_ID') ?: "dev.frankenmanager.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = Integer.parseInt(setting('APP_BUILD') ?: appVersion.getProperty('versionCode') ?: '1')
        versionName = setting('APP_VERSION') ?: appVersion.getProperty('versionName') ?: "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The debug build is signed by the machine's debug key (~/.android/debug.keystore). The release build is signed
    // by ANDROID_KEYSTORE when given, otherwise it comes out unsigned.
    signingConfigs {
        if (setting('ANDROID_KEYSTORE')) {
            release {
                storeFile file(setting('ANDROID_KEYSTORE'))
                storePassword setting('ANDROID_KEYSTORE_PASSWORD')
                keyAlias setting('ANDROID_KEY_ALIAS')
                keyPassword setting('ANDROID_KEY_PASSWORD') ?: setting('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (setting('ANDROID_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
