packages:
  - app
  - embedded
  - mobile
allowBuilds:
  esbuild: true
  vue-demi: true
overrides:
  # fontless (@nuxt/fonts, through @nuxt/ui) asks for esbuild ^0.27,
  # affected by GHSA advisories fixed in 0.28.1
  esbuild: 0.28.2
  # xcode 3 (@capacitor/cli) asks for uuid ^7, affected by
  # GHSA-w5hq-g745-h8pq (fixed in 11.1.1); it only calls uuid.v4()
  uuid: 11.1.1
